name: Bug report
description: Report a reproducible Counterfire client or multiplayer problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test Counterfire. Remove lobby codes, tokens, server addresses, user records, and other private information before submitting.
  - type: input
    id: version
    attributes:
      label: Counterfire version
      description: Find this in Counterfire's About or diagnostics view.
      placeholder: "3.4.4"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Overlay or controls
        - Map, markers, or measurement
        - Lobby or synchronization
        - Installer or updater
        - Performance
        - Other
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the shortest sequence that consistently produces the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and exact error
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Display setup
      description: Include display count, scaling percentages, and which display ran Broken Arrow and Counterfire when relevant.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed lobby codes, tokens, server addresses, user records, and other private information.
          required: true
        - label: I checked that this problem still occurs in the latest Counterfire release.
          required: true
